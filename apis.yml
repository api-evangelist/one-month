name: One Month
description: >-
  One Month is an online coding education platform that teaches beginners
  practical software and web development skills through short, project-based
  video courses designed to be completed in about a month. Its catalog spans
  programming languages and frameworks such as Ruby, Ruby on Rails, Python,
  JavaScript, HTML & CSS, SQL, and WordPress, alongside professional skills
  like project management, using a "watch, do, repeat" methodology of hands-on
  lessons and follow-along projects. One Month markets itself to career
  changers and non-programmers looking to accelerate into technical roles, and
  publishes a supporting blog of programming tutorials and career guidance. It
  is a consumer-facing learning product and does not currently publish a public
  developer API, SDKs, or webhooks. This profile was added to the API
  Evangelist network as a portfolio lead awaiting the enrichment pipeline.
